services:
  mlflow:
    image: arabic-legal-qa:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: arabic-legal-qa:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      LLM_PROVIDER: groq
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_CONFIG_MODEL: ${MLFLOW_CONFIG_MODEL:-arabic-legal-rag-config}
      MLFLOW_CONFIG_ALIAS: ${MLFLOW_CONFIG_ALIAS:-champion}
      MLFLOW_CONFIG_REQUIRED: ${MLFLOW_CONFIG_REQUIRED:-false}
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model-cache:/app/data/model_cache
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

volumes:
  model-cache:
  mlflow-data:
