[project]
name = "arabic-legal-qa"
version = "0.1.0"
description = "Grounded bilingual Q&A over the Egyptian Civil Code"

requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1,<2",
    "langchain-core>=1,<2",
    "langchain-groq>=1,<2",
    "mlflow>=3,<4",
    "qdrant-client>=1.15,<2",
    "fastembed>=0.7,<1",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1,<2",
    "tokenizers>=0.21,<1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1,<2"]
evaluation = ["ragas>=0.3.9,<0.4", "langchain-community>=0.3,<0.4", "pandas>=2,<4"]

[project.scripts]
arabic-legal-qa = "arabic_legal_qa.rag.cli:main"
arabic-legal-qa-evaluate = "arabic_legal_qa.evaluation.runner:main"

[tool.ruff.lint.per-file-ignores]
"src/api/*.py" = ["B008"]

[dependency-groups]
dvc = [
    "dvc[s3]>=3,<4",
]
notebook = [
    "jupyterlab>=4,<5",
    "ipywidgets>=8,<9",
    "ipykernel>=6,<8",
    "nbformat>=5,<6",
    "nbclient>=0.10,<1",
    "pdfplumber>=0.11,<0.12",
    "pydantic>=2,<3",
    "langchain-qdrant>=1,<2",
    "langchain-google-genai>=4,<5",
]
evaluation = [
    "ragas>=0.3.9,<0.4",
    "langchain-community>=0.3,<0.4",
    "pandas>=2,<4",
]
test = [
    "pytest>=8,<9",
]
lint = [
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["arabic_legal_qa", "api", "helpers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
