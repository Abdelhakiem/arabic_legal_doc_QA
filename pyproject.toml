[project]
name = "arabic-legal-qa"
version = "0.1.0"
description = "Grounded bilingual Q&A over the Egyptian Civil Code"

requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1,<2",
    "langchain-core>=1,<2",
    "langchain-huggingface>=1,<2",
    "langchain-ollama>=1,<2",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=5,<6",
    "transformers>=5,<6",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
arabic-legal-qa = "arabic_legal_qa:main"

[dependency-groups]
notebook = [
    "jupyterlab>=4,<5",
    "ipywidgets>=8,<9",
    "ipykernel>=6,<8",
    "nbformat>=5,<6",
    "nbclient>=0.10,<1",
    "pdfplumber>=0.11,<0.12",
    "pydantic>=2,<3",
    "langchain-qdrant>=1,<2",
    "qdrant-client>=1.15,<2",
    "fastembed>=0.7,<1",
    "langchain-google-genai>=4,<5",
    "mlflow>=3,<4",
    "pandas>=2,<4",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
