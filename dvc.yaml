stages:
  build-corpus:
    cmd: uv run python -m arabic_legal_qa.rag.pdf_loader data/raw/egyptian_civil_law.pdf data/processed --project-defaults
    deps:
      - data/raw/egyptian_civil_law.pdf
      - pyproject.toml
      - uv.lock
      - src/arabic_legal_qa/rag/helper.py
      - src/arabic_legal_qa/rag/pdf_loader.py
      - src/helpers/config.py
    outs:
      - data/processed/extraction_rows.json
      - data/processed/article_candidates.json
      - data/processed/extraction_report.json
      - data/processed/validation_status.json
      - data/processed/articles.json
