global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: [app:8000]

  - job_name: ragas-pushgateway
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
